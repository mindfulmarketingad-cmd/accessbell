<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 282" width="800" height="282" role="img" aria-labelledby="t d">
<title id="t">Average detected errors per home page</title>
<desc id="d">Bar chart: an average of 51 detected errors per home page in 2025 and 56.1 in 2026, an increase of 10.1 percent.</desc>
<rect width="800" height="282" rx="16" fill="#ffffff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#22262f" text-anchor="start">Average detected errors per home page</text><text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Up 10.1% in a year</text><text x="40" y="132" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#22262f" text-anchor="start">2025</text><rect x="160" y="114" width="540" height="26" rx="6" fill="#f2f4f1"/><rect x="160" y="114" width="459" height="26" rx="6" fill="#a7b0be"/><text x="712" y="134" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="start">51</text><text x="40" y="188" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#22262f" text-anchor="start">2026</text><rect x="160" y="170" width="540" height="26" rx="6" fill="#f2f4f1"/><rect x="160" y="170" width="504.90000000000003" height="26" rx="6" fill="#b42318"/><text x="712" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="start">56.1</text><text x="40" y="260" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6170" text-anchor="start">Data: WebAIM Million, 2026 report. More than 56 million errors detected.</text><text x="760" y="260" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
