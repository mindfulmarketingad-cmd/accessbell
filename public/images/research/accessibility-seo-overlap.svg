<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">Where accessibility and SEO overlap</title>
<desc id="d">Venn diagram. Accessibility only: keyboard access, visible focus, color contrast, motion controls. SEO only: backlinks, keyword research, site authority, sitemaps. Both: image alt text, headings, descriptive links, page titles, captions, transcripts, mobile friendly design.</desc>
<rect width="800" height="500" rx="16" fill="#ffffff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#22262f" text-anchor="start">Where accessibility and SEO overlap</text><text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Many of the same fixes help people, screen readers and search engines</text><circle cx="300" cy="285" r="175" fill="#44723f" fill-opacity="0.16" stroke="#44723f" stroke-width="2"/><circle cx="500" cy="285" r="175" fill="#b42318" fill-opacity="0.10" stroke="#b42318" stroke-width="2"/><text x="225" y="200" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#44723f" text-anchor="middle">Accessibility only</text><text x="225" y="235" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Keyboard access</text><text x="225" y="263" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Visible focus</text><text x="225" y="291" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Color contrast</text><text x="225" y="319" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Motion controls</text><text x="575" y="200" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#b42318" text-anchor="middle">SEO only</text><text x="575" y="235" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Backlinks</text><text x="575" y="263" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Keyword research</text><text x="575" y="291" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Site authority</text><text x="575" y="319" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="middle">Sitemaps</text><text x="400" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="middle">Both</text><text x="400" y="220" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Image alt text</text><text x="400" y="246" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Headings</text><text x="400" y="272" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Descriptive links</text><text x="400" y="298" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Page titles</text><text x="400" y="324" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Captions</text><text x="400" y="350" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Transcripts</text><text x="400" y="376" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="middle">Mobile friendly</text><text x="40" y="478" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6170" text-anchor="start">Illustration by AccessBell. See the page text for sources.</text><text x="760" y="478" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
