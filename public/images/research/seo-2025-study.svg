<title id="t">Higher accessibility scores and SEO metrics across 10,000 websites</title>
<desc id="d">Bar chart of reported differences for sites with higher accessibility scores: 23 percent more organic traffic, 27 percent more organic keywords and a 19 percent higher Authority Score.</desc>
<rect width="800" height="338" rx="16" fill="#ffffff"/>
