<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-labelledby="t d">
<title id="t">Organic traffic after accessibility remediation, 847 sites</title>
<desc id="d">Stacked bar: 66.1 percent of sites grew organic traffic by 1 to 50 percent, 7.3 percent grew more than 50 percent, and 26.6 percent, derived, did not grow. The average change was plus 12 percent.</desc>
<rect width="800" height="290" rx="16" fill="#ffffff"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#22262f" text-anchor="start">Organic traffic after accessibility remediation</text><text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">847 sites, three months before vs three months after</text><rect x="40" y="110" width="475.91999999999996" height="44" fill="#44723f"/><text x="48" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="start">66.1%</text><rect x="515.92" y="110" width="52.559999999999995" height="44" fill="#84b082"/><text x="523.92" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="start">7.3%</text><rect x="568.4799999999999" y="110" width="191.52" height="44" fill="#a7b0be"/><text x="576.4799999999999" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#22262f" text-anchor="start">26.6%</text><text x="40" y="184" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">66.1%: traffic up 1% to 50%</text><text x="300" y="184" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">7.3%: up more than 50%</text><text x="540" y="184" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">26.6%: no growth (derived)</text><text x="40" y="220" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="start">Average change across all 847 sites: +12% organic traffic</text><text x="40" y="268" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6170" text-anchor="start">Data: Semrush with AccessibilityChecker.org and BuiltWith. Correlation, not proof.</text><text x="760" y="268" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
