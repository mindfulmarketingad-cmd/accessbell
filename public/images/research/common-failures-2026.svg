<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 494" width="800" height="494" role="img" aria-labelledby="t d">
<title id="t">The six most common accessibility failures on home pages</title>
<desc id="d">Bar chart of the share of home pages with each failure: low contrast text 83.9 percent, missing image alt text 53.1, missing form input labels 51.0, empty links 45.4, empty buttons 29.6 and missing document language 15.8.</desc>
<rect width="800" height="494" rx="16" fill="#ffffff"/>
