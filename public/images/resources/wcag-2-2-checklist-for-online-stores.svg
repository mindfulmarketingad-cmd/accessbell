<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Six WCAG 2.2 checks for an online store</title>
  <desc id="desc">Level A and AA criteria to check on a product page, cart, and checkout: 2.4.11 focus not entirely hidden, 2.5.7 a click alternative to dragging, 2.5.8 targets at least 24 by 24 CSS pixels, 3.2.6 help in the same order, 3.3.7 no repeated entry, and 3.3.8 authentication that is not only a memory test.</desc>
  <rect width="840" height="420" fill="#f4f8f3"/>
  <text x="24" y="36" fill="#22262f" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="700">WCAG 2.2 Level A and AA checks on a store</text>
  <g font-family="system-ui, Segoe UI, sans-serif" fill="#22262f">
    <g>
      <rect x="24" y="56" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="40" y="88" font-size="14" font-weight="700" fill="#365c32">2.4.11 · AA</text>
      <text x="40" y="116" font-size="16" font-weight="700">Focus not hidden</text>
      <text x="40" y="144" font-size="14" fill="#353a47">Sticky bars and</text>
      <text x="40" y="166" font-size="14" fill="#353a47">cookie banners.</text>
    </g>
    <g>
      <rect x="294" y="56" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="310" y="88" font-size="14" font-weight="700" fill="#365c32">2.5.7 · AA</text>
      <text x="310" y="116" font-size="16" font-weight="700">Drag has a click</text>
      <text x="310" y="144" font-size="14" fill="#353a47">Cart reorder and</text>
      <text x="310" y="166" font-size="14" fill="#353a47">price sliders.</text>
    </g>
    <g>
      <rect x="564" y="56" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="580" y="88" font-size="14" font-weight="700" fill="#365c32">2.5.8 · AA</text>
      <text x="580" y="116" font-size="16" font-weight="700">24 by 24 pixels</text>
      <text x="580" y="144" font-size="14" fill="#353a47">Quantity and</text>
      <text x="580" y="166" font-size="14" fill="#353a47">icon buttons.</text>
    </g>
    <g>
      <rect x="24" y="220" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="40" y="252" font-size="14" font-weight="700" fill="#365c32">3.2.6 · A</text>
      <text x="40" y="280" font-size="16" font-weight="700">Help stays put</text>
      <text x="40" y="308" font-size="14" fill="#353a47">Chat and phone</text>
      <text x="40" y="330" font-size="14" fill="#353a47">in one order.</text>
    </g>
    <g>
      <rect x="294" y="220" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="310" y="252" font-size="14" font-weight="700" fill="#365c32">3.3.7 · A</text>
      <text x="310" y="280" font-size="16" font-weight="700">Do not retype</text>
      <text x="310" y="308" font-size="14" fill="#353a47">Address and email</text>
      <text x="310" y="330" font-size="14" fill="#353a47">already entered.</text>
    </g>
    <g>
      <rect x="564" y="220" width="252" height="148" rx="12" fill="#ffffff" stroke="#cfd4ce"/>
      <text x="580" y="252" font-size="14" font-weight="700" fill="#365c32">3.3.8 · AA</text>
      <text x="580" y="280" font-size="16" font-weight="700">Not only memory</text>
      <text x="580" y="308" font-size="14" fill="#353a47">Password managers</text>
      <text x="580" y="330" font-size="14" fill="#353a47">and paste count.</text>
    </g>
  </g>
</svg>
