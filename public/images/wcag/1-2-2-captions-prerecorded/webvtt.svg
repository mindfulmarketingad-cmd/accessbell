<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Add a caption file to the video element</text><rect x="24" y="64" width="370" height="162" rx="10" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="38" y="88" font-size="13" font-weight="400" fill="#9fd19a" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">WEBVTT</text><text x="38" y="108" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"></text><text x="38" y="128" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">00:00:04.000 --&gt; 00:00:07.000</text><text x="38" y="148" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">&lt;v Maya&gt;The fly sheet goes on last.</text><text x="38" y="168" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"></text><text x="38" y="188" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">00:00:07.500 --&gt; 00:00:09.000</text><text x="38" y="208" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">[rain hammering on the tent]</text><rect x="410" y="64" width="366" height="182" rx="10" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="424" y="88" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">&lt;video controls&gt;</text><text x="424" y="108" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">  &lt;source src="tent.mp4"</text><text x="424" y="128" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">          type="video/mp4"&gt;</text><text x="424" y="148" font-size="13" font-weight="400" fill="#b9e3b3" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">  &lt;track kind="captions"</text><text x="424" y="168" font-size="13" font-weight="400" fill="#b9e3b3" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">         src="tent.en.vtt"</text><text x="424" y="188" font-size="13" font-weight="400" fill="#b9e3b3" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">         srclang="en"</text><text x="424" y="208" font-size="13" font-weight="400" fill="#b9e3b3" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">         label="English"&gt;</text><text x="424" y="228" font-size="13" font-weight="400" fill="#e6e9ee" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">&lt;/video&gt;</text>
