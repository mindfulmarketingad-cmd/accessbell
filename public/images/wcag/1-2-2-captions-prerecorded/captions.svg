<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">Accurate, complete captions</text><rect x="48" y="90" width="316" height="190" rx="10" fill="#2b3240"/><circle cx="206" cy="175" r="22" fill="rgba(255,255,255,0.18)"/><rect x="198" y="164" width="6" height="22" fill="#fff"/><rect x="209" y="164" width="6" height="22" fill="#fff"/><rect x="60" y="262" width="292" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/><rect x="60" y="262" width="102.19999999999999" height="5" rx="2.5" fill="#9fd19a"/><rect x="68" y="212" width="276" height="28" rx="4" fill="rgba(0,0,0,0.78)" stroke="none" stroke-width="1.5"/><text x="206" y="231" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">the fly she goes on vast</text><text x="206" y="320" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">Unchecked auto-captions miss words,</text>
