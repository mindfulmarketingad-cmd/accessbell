<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="300" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Keys keyboard users rely on</text><rect x="24" y="70" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="36" y="82" width="53" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="62.5" y="104" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Tab</text><text x="103" y="104" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Move to the next control</text><rect x="412" y="70" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="424" y="82" width="125" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="486.5" y="104" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Shift + Tab</text><text x="563" y="104" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Move back</text><rect x="24" y="144" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="36" y="156" width="71" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="71.5" y="178" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Enter</text><text x="121" y="178" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Follow a link, press a button</text><rect x="412" y="144" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="424" y="156" width="71" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="459.5" y="178" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Space</text><text x="509" y="178" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Press a button, tick a checkbox</text><rect x="24" y="218" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="36" y="230" width="116" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="94" y="252" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Arrow keys</text><text x="166" y="252" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Menus, radios, sliders, tabs</text><rect x="412" y="218" width="368" height="58" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="424" y="230" width="53" height="34" rx="7" fill="#eef0f3" stroke="#b9bfc8" stroke-width="1.5"/><text x="450.5" y="252" font-size="14" font-weight="800" fill="#1f2430" text-anchor="middle">Esc</text><text x="491" y="252" font-size="14" font-weight="400" fill="#5b6270" text-anchor="start">Close a dialog or menu</text>
