<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="380" fill="#fff"/>
<rect x="24" y="20" width="364" height="340" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#b42318"/><path d="M52 52l12 12M64 52l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="65" font-size="18" font-weight="700" fill="#b42318" text-anchor="start">Single keys fire shortcuts</text>
<rect x="412" y="20" width="364" height="340" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#44723f"/><path d="M439 58l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">Shortcuts can be turned off</text><text x="48" y="104" font-size="13" font-weight="700" fill="#5b6270" text-anchor="start">Voice user dictates:</text><rect x="48" y="114" width="316" height="44" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="62" y="142" font-size="15" font-weight="600" fill="#1f2430" text-anchor="start">"Search for socks"</text><rect x="48" y="180" width="94.4" height="24" rx="12" fill="#f8dcd9" stroke="#f8dcd9" stroke-width="1.5"/><text x="95.2" y="195" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">s → Search</text><rect x="198" y="180" width="109.28" height="24" rx="12" fill="#f8dcd9" stroke="#f8dcd9" stroke-width="1.5"/><text x="252.64" y="195" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">f → Favorite</text><rect x="48" y="212" width="79.52" height="24" rx="12" fill="#f8dcd9" stroke="#f8dcd9" stroke-width="1.5"/><text x="87.75999999999999" y="227" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">o → Open</text><rect x="198" y="212" width="101.84" height="24" rx="12" fill="#f8dcd9" stroke="#f8dcd9" stroke-width="1.5"/><text x="248.92000000000002" y="227" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">c → Comment</text><text x="206" y="300" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">Each letter spoken triggers a different</text>
<text x="206" y="319" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">action</text><text x="436" y="104" font-size="13" font-weight="700" fill="#5b6270" text-anchor="start">Voice user dictates:</text><rect x="436" y="114" width="316" height="44" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="450" y="142" font-size="15" font-weight="600" fill="#1f2430" text-anchor="start">"Search for socks"</text><rect x="436" y="178" width="316" height="70" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="450" y="206" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Keyboard shortcuts</text><rect x="686" y="192" width="50" height="26" rx="13" fill="#c7ccd4" stroke="none" stroke-width="1.5"/><circle cx="699" cy="205" r="10" fill="#fff"/><text x="450" y="230" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">Off</text><text x="594" y="300" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">The words are typed, nothing else happens</text>
</svg>
