<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="240" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Meet 2.1.4 with at least one of these</text><rect x="24" y="66" width="240" height="150" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="52" cy="98" r="13" fill="#44723f"/><path d="M45 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Turn off</text><text x="44" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">A setting switches single-key</text>
<text x="44" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">shortcuts off.</text><rect x="280" y="66" width="240" height="150" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="308" cy="98" r="13" fill="#44723f"/><path d="M301 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Remap</text><text x="300" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">People can change a shortcut to</text>
<text x="300" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">include Ctrl, Alt or another</text>
<text x="300" y="174" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">modifier key.</text><rect x="536" y="66" width="240" height="150" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="564" cy="98" r="13" fill="#44723f"/><path d="M557 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Only on focus</text><text x="556" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">The shortcut works only while</text>
<text x="556" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">its own component, such as a</text>
<text x="556" y="174" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">list or player, has focus.</text>
</svg>
