<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="380" fill="#fff"/>
<rect x="24" y="20" width="364" height="340" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#b42318"/><path d="M52 52l12 12M64 52l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="65" font-size="16" font-weight="700" fill="#b42318" text-anchor="start">A silent video, no description</text>
<rect x="412" y="20" width="364" height="340" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#44723f"/><path d="M439 58l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">A text or audio alternative</text><rect x="48" y="90" width="316" height="130" rx="10" fill="#2b3240"/><circle cx="206" cy="145" r="22" fill="rgba(255,255,255,0.18)"/><path d="M199 133l18 12-18 12z" fill="#fff"/><rect x="60" y="202" width="292" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/><rect x="60" y="202" width="102.19999999999999" height="5" rx="2.5" fill="#9fd19a"/><text x="62" y="114" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">How to pitch a tent (no sound)</text><text x="206" y="336" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">Blind visitors cannot follow the steps</text><rect x="436" y="90" width="316" height="130" rx="10" fill="#2b3240"/><circle cx="594" cy="145" r="22" fill="rgba(255,255,255,0.18)"/><path d="M587 133l18 12-18 12z" fill="#fff"/><rect x="448" y="202" width="292" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/><rect x="448" y="202" width="102.19999999999999" height="5" rx="2.5" fill="#9fd19a"/><text x="450" y="114" font-size="12" font-weight="700" fill="#e6e9ee" text-anchor="start">How to pitch a tent (no sound)</text><text x="436" y="246" font-size="13" font-weight="800" fill="#1f2430" text-anchor="start">What the video shows:</text><text x="436" y="266" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">1. Lay out the tent body. 2. Clip on the</text>
<text x="436" y="285" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">poles. 3. Stake each corner.</text><text x="594" y="336" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">Blind visitors get the same steps in text</text>
<text x="594" y="355" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">or narration</text>
