<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="240" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">How cancelling a press works</text><rect x="24" y="70" width="172" height="100" rx="12" fill="#eef0f3" stroke="#c7ccd4" stroke-width="1.5"/><text x="110" y="112" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">1. Press down</text><text x="110" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="middle">on the button</text><path d="M200 120L212 120M203.0 124.3L212 120L203.0 115.7" fill="none" stroke="#5b6270" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="70" width="172" height="100" rx="12" fill="#eef0f3" stroke="#c7ccd4" stroke-width="1.5"/><text x="302" y="112" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">2. Move away</text><text x="302" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="middle">still pressing</text><path d="M392 120L404 120M395.0 124.3L404 120L395.0 115.7" fill="none" stroke="#5b6270" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="408" y="70" width="172" height="100" rx="12" fill="#eef0f3" stroke="#c7ccd4" stroke-width="1.5"/><text x="494" y="112" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">3. Release</text><text x="494" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="middle">outside the button</text><path d="M584 120L596 120M587.0 124.3L596 120L587.0 115.7" fill="none" stroke="#5b6270" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="70" width="172" height="100" rx="12" fill="#f4f8f3" stroke="#44723f" stroke-width="1.5"/><text x="686" y="112" font-size="15" font-weight="800" fill="#365c32" text-anchor="middle">Nothing happens</text><text x="686" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="middle">the action is cancelled</text><text x="400" y="206" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">Native buttons and links already work this way: their click event fires on release, inside the</text>
<text x="400" y="225" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">element.</text>
</svg>
