<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="380" fill="#fff"/>
<rect x="24" y="20" width="364" height="340" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#b42318"/><path d="M52 52l12 12M64 52l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="65" font-size="19" font-weight="700" fill="#b42318" text-anchor="start">Acts on press down</text>
<rect x="412" y="20" width="364" height="340" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#44723f"/><path d="M439 58l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="65" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Acts on release, can be cancelled</text><rect x="48" y="110" width="170" height="38" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="133" y="134" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle">Delete account</text><rect x="48" y="170" width="316" height="42" rx="10" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="62" y="194" font-size="13" font-weight="400" fill="#f3b4ae" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">button.onmousedown = deleteAccount</text><text x="48" y="242" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">The account is deleted the instant the</text>
<text x="48" y="261" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">button is pressed, before people can</text>
<text x="48" y="280" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">change their mind.</text><text x="206" y="336" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">An accidental tap cannot be undone</text><rect x="436" y="110" width="170" height="38" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="521" y="134" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle">Delete account</text><rect x="436" y="170" width="316" height="42" rx="10" fill="#1f2430" stroke="#1f2430" stroke-width="1.5"/><text x="450" y="194" font-size="13" font-weight="400" fill="#b9e3b3" text-anchor="start" font-family="'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve">button.onclick = deleteAccount</text><text x="436" y="242" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">Pressed by mistake? Slide your finger or</text>
<text x="436" y="261" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">pointer off the button before letting go,</text>
<text x="436" y="280" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">and nothing happens.</text><text x="594" y="336" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">Accidental presses can be abandoned</text>
</svg>
