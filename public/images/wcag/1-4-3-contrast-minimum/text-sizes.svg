<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="320" fill="#fff"/>
<rect x="24" y="20" width="364" height="280" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#44723f"/><path d="M51.0 58l5.0 5.0 10.0 -11.0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="65" font-size="19" font-weight="700" fill="#365c32" text-anchor="start">Large text: 3:1 needed</text>
<rect x="48" y="84" width="316" height="110" rx="10" fill="#fff" stroke="#d9dde3"/><text x="66" y="130" font-size="24" font-weight="700" fill="#949494" text-anchor="start">Pick a campsite</text>
<text x="66" y="166" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">24 px bold heading</text>
<text x="48" y="232" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">#949494 on white: 3.0:1</text>
<text x="48" y="258" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Large text needs 3:1, so it passes</text>
<rect x="412" y="20" width="364" height="280" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#b42318"/><path d="M440.0 52.0l12.0 12.0M452.0 52.0l-12.0 12.0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="470" y="65" font-size="19" font-weight="700" fill="#b42318" text-anchor="start">Body text: 4.5:1 needed</text>
<rect x="436" y="84" width="316" height="110" rx="10" fill="#fff" stroke="#d9dde3"/><text x="454" y="118" font-size="16" font-weight="400" fill="#949494" text-anchor="start">Sites near the lake fill up fast in</text>
<text x="454" y="142" font-size="16" font-weight="400" fill="#949494" text-anchor="start">summer, so book early.</text>
<text x="454" y="172" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">16 px body text</text>
<text x="436" y="232" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">#949494 on white: 3.0:1</text>
<text x="436" y="258" font-size="14" font-weight="700" fill="#b42318" text-anchor="start">Normal text needs 4.5:1, so it fails</text>
</svg>
