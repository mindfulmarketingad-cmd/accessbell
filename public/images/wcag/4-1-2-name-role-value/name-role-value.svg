<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="t d">
<title id="t">What a screen reader needs to know about a control</title>
<desc id="d">A Mute button that is switched on. A screen reader reads: Mute, toggle button, pressed. Three cards explain the parts: Name, what the control is called; Role, what kind of control it is; and Value or state, what it is set to right now.</desc>
<rect width="800" height="410" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">What a screen reader needs to know about a control</text><rect x="40" y="76" width="720" height="96" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><rect x="70" y="100" width="150" height="48" rx="10" fill="#fff" stroke="#22262f" stroke-width="2"/><text x="145" y="131" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#22262f" text-anchor="middle">Mute</text><text x="260" y="118" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#22262f" text-anchor="start">A speaker button that is switched on</text><text x="260" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">The screen reader reads: “Mute, toggle button, pressed”</text><rect x="40" y="198" width="230" height="178" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="56" y="228" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="start">Name</text><text x="56" y="254" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">What is it called?</text><text x="56" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#22262f" text-anchor="start">“Mute”</text><text x="56" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">Text, a label, alt text,</text><text x="56" y="340" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">aria-label or</text><text x="56" y="358" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">aria-labelledby</text><rect x="285" y="198" width="230" height="178" rx="12" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="301" y="228" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="start">Role</text><text x="301" y="254" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">What kind of control is it?</text><text x="301" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#22262f" text-anchor="start">“toggle button”</text><text x="301" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">A native element such as</text><text x="301" y="340" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">&lt;button&gt;, or an ARIA role</text><rect x="530" y="198" width="230" height="178" rx="12" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="546" y="228" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="start">Value / state</text><text x="546" y="254" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">What is it set to right now?</text><text x="546" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#22262f" text-anchor="start">“pressed”</text><text x="546" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">Native attributes, or</text><text x="546" y="340" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">aria-pressed, aria-expanded,</text><text x="546" y="358" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">aria-checked</text>
<text x="760" y="394" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
