<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="t d">
<title id="t">Keep the state in sync with what people see</title>
<desc id="d">Two versions of a Menu button. Closed: aria-expanded is false and a screen reader says Menu, button, collapsed. Open: two menu items show, aria-expanded is true and a screen reader says Menu, button, expanded.</desc>
<rect width="800" height="388" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Keep the state in sync with what people see</text><rect x="40" y="76" width="350" height="256" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="60" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#5b6170" text-anchor="start">Menu is closed</text><rect x="60" y="120" width="180" height="44" rx="10" fill="#fff" stroke="#22262f" stroke-width="2"/><text x="80" y="148" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="start">Menu</text><text x="218" y="149" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#22262f" text-anchor="end">▾</text><rect x="60" y="190" width="310" height="34" rx="8" fill="#22262f"/><text x="72" y="212" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ed" text-anchor="start">aria-expanded=&quot;false&quot;</text><text x="60" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6170" text-anchor="start">Screen reader: “Menu, button, collapsed”</text><rect x="410" y="76" width="350" height="256" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="430" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#44723f" text-anchor="start">Menu is open</text><rect x="430" y="120" width="180" height="44" rx="10" fill="#fff" stroke="#22262f" stroke-width="2"/><text x="450" y="148" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="start">Menu</text><text x="588" y="149" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#22262f" text-anchor="end">▴</text><rect x="430" y="170" width="180" height="56" rx="8" fill="#fff" stroke="#cfd4ce"/><text x="444" y="194" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="start">Products</text><text x="444" y="214" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#22262f" text-anchor="start">Pricing</text><rect x="430" y="240" width="310" height="34" rx="8" fill="#22262f"/><text x="442" y="262" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#84b082" text-anchor="start">aria-expanded=&quot;true&quot;</text><text x="430" y="302" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6170" text-anchor="start">Screen reader: “Menu, button, expanded”</text><text x="40" y="364" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Update aria-expanded in the same script that opens and closes the menu.</text>
<text x="760" y="372" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
