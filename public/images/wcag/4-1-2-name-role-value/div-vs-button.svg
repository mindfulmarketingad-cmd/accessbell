ont-size="14" font-weight="700" fill="#b42318" text-anchor="start">skips it</text><text x="60" y="348" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Enter / Space</text><text x="190" y="348" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#b42318" text-anchor="start">does nothing</text><rect x="410" y="76" width="350" height="300" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="430" y="108" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="start">Native button</text><rect x="430" y="124" width="140" height="46" rx="10" fill="#44723f"/><text x="500" y="154" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Save</text><rect x="430" y="186" width="310" height="62" rx="8" fill="#22262f"/><text x="442" y="212" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#eef2ed" text-anchor="start">&lt;button type=&quot;button&quot;&gt;</text><text x="454" y="234" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#eef2ed" text-anchor="start">Save&lt;/button&gt;</text><text x="430" y="276" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Name</text><text x="560" y="276" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#44723f" text-anchor="start">Save</text><text x="430" y="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Role</text><text x="560" y="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#44723f" text-anchor="start">button</text