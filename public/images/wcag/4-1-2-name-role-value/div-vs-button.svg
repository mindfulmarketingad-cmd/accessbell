<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d">
<title id="t">Same look, different code</title>
<desc id="d">Two identical green Save buttons. The styled div has no role, is skipped by the Tab key and does nothing on Enter or Space. The native button has the name Save, the role button, can be reached with Tab and is activated with Enter or Space.</desc>
<rect width="800" height="404" rx="16" fill="#fff"/>
