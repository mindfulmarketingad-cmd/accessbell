<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">Sound plus a visible message</text><rect x="48" y="92" width="316" height="60" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="62" y="128" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">"Start speaking after the beep."</text><path d="M62 180h10l12-10v40l-12-10h-10z" fill="#5b6270"/><text x="96" y="198" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">beep</text><text x="206" y="280" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">Deaf users never hear the cue</text><rect x="436" y="92" width="316" height="60" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="450" y="128" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">"Start when the timer reaches zero."</text><path d="M450 180h10l12-10v40l-12-10h-10z" fill="#5b6270"/><text x="484" y="198" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">beep</text><rect x="546" y="180" width="124.78" height="25" rx="12.5" fill="#fdf0ef" stroke="#fdf0ef" stroke-width="1.5"/><text x="608.39" y="196" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">Recording now</text><text x="594" y="280" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">Deaf users see when to start</text>
