<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="310" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Count the flashes in any one second</text><circle cx="38" cy="90" r="13" fill="#b42318"/><path d="M32 84l12 12M44 84l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="60" y="96" font-size="15" font-weight="800" fill="#b42318" text-anchor="start">5 flashes per second</text><rect x="260" y="66" width="516" height="48" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="270.0" y="74" width="49.6" height="32" rx="4" fill="#f08a80"/><rect x="369.2" y="74" width="49.6" height="32" rx="4" fill="#f08a80"/><rect x="468.4" y="74" width="49.6" height="32" rx="4" fill="#f08a80"/><rect x="567.6" y="74" width="49.6" height="32" rx="4" fill="#f08a80"/><rect x="666.8" y="74" width="49.6" height="32" rx="4" fill="#f08a80"/><circle cx="38" cy="164" r="13" fill="#44723f"/><path d="M31 164l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="170" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">2 flashes per second</text><rect x="260" y="140" width="516" height="48" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="270.0" y="148" width="124.0" height="32" rx="4" fill="#9fd19a"/><rect x="518.0" y="148" width="124.0" height="32" rx="4" fill="#9fd19a"/><path d="M260 206H776" stroke="#5b6270" stroke-width="1.5"/><text x="260" y="224" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">0 s</text><text x="776" y="224" font-size="12" font-weight="400" fill="#5b6270" text-anchor="end">1 s</text><text x="400" y="262" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">More than 3 flashes in a second fails, unless the flashing is below the general and red flash</text>
<text x="400" y="281" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">thresholds. The safest rule: never flash more than 3 times a second.</text>
</svg>
