<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="320" fill="#ffffff"/>
  <rect x="24" y="20" width="364" height="280" rx="16" fill="#f4f8f3" stroke="#cfd4ce" stroke-width="2"/>
  <text x="48" y="58" font-size="19" font-weight="700" fill="#22262f">Exception: real-time event</text>
  <rect x="48" y="80" width="316" height="130" rx="12" fill="#ffffff" stroke="#cfd4ce" stroke-width="2"/>
  <rect x="64" y="96" width="52" height="24" rx="5" fill="#b42318"/><text x="90" y="113" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
  <text x="64" y="148" font-size="16" font-weight="700" fill="#22262f">Charity auction: vintage bike</text>
  <text x="64" y="172" font-size="14.5" fill="#353a47">Current bid $240</text>
  <text x="64" y="194" font-size="14.5" fill="#b42318">Bidding closes at 8:00 p.m.</text>
  <text x="48" y="246" font-size="14.5" fill="#353a47">The deadline is part of the event itself,</text>
  <text x="48" y="268" font-size="14.5" fill="#353a47">so a time limit is allowed.</text>
  <rect x="412" y="20" width="364" height="280" rx="16" fill="#f4f8f3" stroke="#cfd4ce" stroke-width="2"/>
  <text x="436" y="58" font-size="19" font-weight="700" fill="#22262f">Exception: media playback</text>
  <rect x="436" y="80" width="316" height="130" rx="12" fill="#22262f"/>
  <circle cx="594" cy="132" r="26" fill="#ffffff"/><path d="M586 119v26l22-13z" fill="#22262f"/>
  <rect x="456" y="184" width="276" height="6" rx="3" fill="#5b6170"/><rect x="456" y="184" width="104" height="6" rx="3" fill="#9fd49c"/>
  <text x="436" y="246" font-size="14.5" fill="#353a47">A video or podcast runs to its own clock,</text>
  <text x="436" y="268" font-size="14.5" fill="#353a47">but nothing is lost if you pause it.</text>
</svg>
