<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-labelledby="t d">
<title id="t">Connect an error message to its field</title>
<desc id="d">An email field with a red outline holds sam@example and shows the error Enter an email address like name@example.com. The input has aria-invalid true and aria-describedby email-error, which matches the id of the error paragraph, so a screen reader reads the error with the field.</desc>
<rect width="800" height="412" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Connect an error message to its field</text><text x="40" y="96" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#22262f" text-anchor="start">Email address</text><rect x="40" y="108" width="380" height="48" rx="8" fill="#fff" stroke="#b42318" stroke-width="2.5"/><text x="56" y="139" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#22262f" text-anchor="start">sam@example</text><rect x="40" y="166" width="380" height="36" rx="8" fill="#fdf0ef"/><text x="56" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#b42318" text-anchor="start">Enter an email address like name@example.com</text><rect x="40" y="230" width="720" height="118" rx="12" fill="#22262f"/><text x="60" y="262" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ed" text-anchor="start">&lt;input id=&quot;email&quot; type=&quot;email&quot; aria-invalid=&quot;true&quot;</text><text x="60" y="286" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#84b082" text-anchor="start">       aria-describedby=&quot;email-error&quot;&gt;</text><text x="60" y="316" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ed" text-anchor="start">&lt;p id=&quot;email-error&quot;&gt;Enter an email address like name@example.com&lt;/p&gt;</text><path d="M 430 184 C 465 184, 480 208, 500 224" fill="none" stroke="#44723f" stroke-width="2.5" stroke-dasharray="6 5"/><polygon points="506,230 493,227 501,217" fill="#44723f"/><text x="520" y="218" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#44723f" text-anchor="start">The matching id links them</text><rect x="470" y="96" width="290" height="96" rx="12" fill="#e8f1e7"/><text x="485" y="122" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="start">A screen reader says</text><text x="485" y="148" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#22262f" text-anchor="start">“Email address, edit text,</text><text x="485" y="168" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#22262f" text-anchor="start">invalid entry. Enter an email</text><text x="485" y="188" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#22262f" text-anchor="start">address like name@example.com”</text><text x="40" y="376" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6170" text-anchor="start">Exact wording varies by screen reader. Announce new errors with role=&quot;alert&quot; or a role=&quot;status&quot; region as they appear.</text><text x="760" y="398" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
