<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="400" fill="#fff"/>
<rect x="24" y="20" width="364" height="360" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#b42318"/><path d="M52 52l12 12M64 52l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="65" font-size="19" font-weight="700" fill="#b42318" text-anchor="start">Focus cannot leave</text>
<rect x="412" y="20" width="364" height="360" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#44723f"/><path d="M439 58l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">A standard key gets you out</text><rect x="48" y="96" width="316" height="160" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="64" y="122" font-size="14" font-weight="800" fill="#1f2430" text-anchor="start">Embedded map</text><rect x="64" y="134" width="284" height="104" rx="8" fill="#e3ecdf"/><circle cx="206" cy="186" r="26" fill="none" stroke="#d64545" stroke-width="3"/><path d="M224 168a26 26 0 1 1-6-6" fill="none" stroke="#d64545" stroke-width="3"/><text x="206" y="286" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">Tab cycles inside the map forever</text><text x="206" y="336" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">The only way out is to reload the page</text><rect x="436" y="96" width="316" height="160" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="452" y="122" font-size="14" font-weight="800" fill="#1f2430" text-anchor="start">Embedded map</text><rect x="452" y="134" width="284" height="104" rx="8" fill="#e3ecdf"/><circle cx="594" cy="186" r="26" fill="none" stroke="#44723f" stroke-width="3"/><path d="M622 186L748 186M739.0 190.3L748 186L739.0 181.7" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="286" font-size="13" font-weight="700" fill="#365c32" text-anchor="middle">Tab or Esc moves on to the next link</text><text x="594" y="336" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">If a special key is needed, the page says</text>
<text x="594" y="355" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">which one</text>
</svg>
