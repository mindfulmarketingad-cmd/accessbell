<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="300" fill="#fff"/>
<circle cx="38" cy="40" r="15" fill="#2f6272"/><text x="38" y="45" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">i</text><text x="62" y="47" font-size="19" font-weight="700" fill="#2f6272" text-anchor="start">A modal dialog is not a trap</text><rect x="24" y="72" width="752" height="170" rx="12" fill="#eef0f3" stroke="#c7ccd4" stroke-width="1.5"/><rect x="220" y="92" width="360" height="130" rx="12" fill="#fff" stroke="#2f6272" stroke-width="2.5"/><text x="240" y="122" font-size="16" font-weight="800" fill="#1f2430" text-anchor="start">Sign in to save your list</text><rect x="240" y="150" width="110" height="38" rx="8" fill="#44723f" stroke="#44723f" stroke-width="1.5"/><text x="295" y="174" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Sign in</text><rect x="362" y="150" width="110" height="38" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="417" y="174" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle">Close</text><rect x="358" y="146" width="118" height="46" rx="11" fill="none" stroke="#1f5fbf" stroke-width="3"/><text x="400" y="268" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">Keeping focus inside an open dialog is expected. It passes because Close and the Escape</text>
<text x="400" y="287" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">key always let people leave.</text>
</svg>
