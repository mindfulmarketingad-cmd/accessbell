<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="420" fill="#fff"/>
<rect x="200" y="20" width="400" height="380" rx="16" fill="#f5f6f8" stroke="#d9dde3" stroke-width="2"/><text x="400" y="64" font-size="20" font-weight="800" fill="#1f2430" text-anchor="middle">Sign in to Trail Supply</text>
<rect x="228" y="88" width="344" height="56" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><circle cx="254" cy="116" r="7" fill="none" stroke="#44723f" stroke-width="2.5"/><path d="M261 116h12m-4 0v5m-4-5v4" stroke="#44723f" stroke-width="2.5" stroke-linecap="round"/><text x="282" y="113" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Sign in with a passkey</text>
<text x="282" y="132" font-size="12.5" font-weight="400" fill="#5b6270" text-anchor="start">Face, fingerprint or device PIN</text>
<rect x="228" y="158" width="344" height="56" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><rect x="247" y="178" width="22" height="16" rx="2" fill="none" stroke="#44723f" stroke-width="2.2"/><path d="M247 179l11 8 11-8" fill="none" stroke="#44723f" stroke-width="2.2"/><text x="282" y="183" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Email me a sign-in link</text>
<text x="282" y="202" font-size="12.5" font-weight="400" fill="#5b6270" text-anchor="start">One click from your inbox</text>
<rect x="228" y="228" width="344" height="56" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><circle cx="258" cy="251" r="5" fill="none" stroke="#44723f" stroke-width="2.2"/><path d="M249 266q9-12 18 0" fill="none" stroke="#44723f" stroke-width="2.2"/><text x="282" y="253" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Continue with your work account</text>
<text x="282" y="272" font-size="12.5" font-weight="400" fill="#5b6270" text-anchor="start">Single sign-on you already use</text>
<path d="M228 318h120M452 318h120" stroke="#d9dde3" stroke-width="1.5"/><text x="400" y="323" font-size="13" font-weight="700" fill="#5b6270" text-anchor="middle">or</text>
<rect x="228" y="338" width="344" height="44" rx="10" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="400" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Use email and password</text>
<text x="40" y="120" font-size="15" font-weight="700" fill="#365c32" text-anchor="start">No memory</text>
<text x="40" y="142" font-size="15" font-weight="700" fill="#365c32" text-anchor="start">test needed</text>
<path d="M150 132h58" stroke="#44723f" stroke-width="2.5"/><path d="M204 126l8 6-8 6" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="366" font-size="14" font-weight="700" fill="#5b6270" text-anchor="start">Password still</text>
<text x="620" y="386" font-size="14" font-weight="700" fill="#5b6270" text-anchor="start">allowed, with help</text>
