<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d">
<title id="t">Why duplicate IDs still cause trouble</title>
<desc id="d">Code shows two labels with for email pointing at two inputs that both have the id email. Both labels attach to the first input, and the second input has no label, so a screen reader reads it only as edit text. Repeated IDs also break aria-labelledby, aria-describedby and in-page links.</desc>
<rect width="800" height="404" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Why duplicate IDs still cause trouble</text><rect x="40" y="76" width="720" height="118" rx="12" fill="#22262f"/><text x="60" y="108" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ed" text-anchor="start">&lt;label for=&quot;email&quot;&gt;Home email&lt;/label&gt;  &lt;input id=&quot;email&quot;&gt;</text><text x="60" y="138" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ed" text-anchor="start">&lt;label for=&quot;email&quot;&gt;Work email&lt;/label&gt;  &lt;input id=&quot;email&quot;&gt;</text><text x="60" y="172" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#84b082" text-anchor="start">Both labels point at id=&quot;email&quot;. Both attach to the first input.</text><rect x="40" y="222" width="350" height="118" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="56" y="250" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#22262f" text-anchor="start">Home email</text><rect x="56" y="260" width="318" height="34" rx="6" fill="#fff" stroke="#cfd4ce"/><text x="56" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#44723f" text-anchor="start">Both labels attach to this field</text><rect x="410" y="222" width="350" height="118" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="426" y="250" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#22262f" text-anchor="start">Work email</text><rect x="426" y="260" width="318" height="34" rx="6" fill="#fff" stroke="#cfd4ce"/><text x="426" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b42318" text-anchor="start">No label: read only as “edit text”</text><text x="40" y="372" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Repeated IDs also break aria-labelledby, aria-describedby and in-page links.</text>
<text x="760" y="388" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
