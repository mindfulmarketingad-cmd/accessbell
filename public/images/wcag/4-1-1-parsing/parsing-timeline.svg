<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" aria-labelledby="t d">
<title id="t">4.1.1 Parsing across WCAG versions</title>
<desc id="d">Timeline. WCAG 2.0, December 2008: 4.1.1 Parsing is Level A. WCAG 2.1, June 2018: Level A. WCAG 2.2, October 2023: removed. In WCAG 2.0 and 2.1 the W3C notes that 4.1.1 always passes for HTML and XML.</desc>
<rect width="800" height="372" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">4.1.1 Parsing across WCAG versions</text><line x1="100" y1="170" x2="700" y2="170" stroke="#cfd4ce" stroke-width="4"/><circle cx="100" cy="170" r="16" fill="#44723f"/><text x="100" y="176" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="100" y="120" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#22262f" text-anchor="middle">WCAG 2.0</text><text x="100" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="middle">December 2008</text><rect x="20" y="206" width="160" height="60" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="100" y="243" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="middle">Level A</text><circle cx="400" cy="170" r="16" fill="#44723f"/><text x="400" y="176" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="400" y="120" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#22262f" text-anchor="middle">WCAG 2.1</text><text x="400" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="middle">June 2018</text><rect x="320" y="206" width="160" height="60" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="400" y="243" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="middle">Level A</text><circle cx="700" cy="170" r="16" fill="#b42318"/><text x="700" y="176" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">×</text><text x="700" y="120" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#22262f" text-anchor="middle">WCAG 2.2</text><text x="700" y="144" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="middle">October 2023</text><rect x="620" y="206" width="160" height="60" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="700" y="243" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#b42318" text-anchor="middle">Removed</text><text x="40" y="312" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">In WCAG 2.0 and 2.1, the W3C now adds a note: 4.1.1 always passes for HTML and XML.</text><text x="40" y="336" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Browsers and assistive technology handle markup errors far better than in 2008.</text>
<text x="760" y="356" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
