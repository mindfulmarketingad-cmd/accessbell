<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" width="800" height="448" role="img" aria-labelledby="t d">
<title id="t">The four things 4.1.1 Parsing asked for</title>
<desc id="d">Four cards, each with a failing and a passing example. Complete start and end tags: p Hello with no closing tag versus a closed paragraph. Correct nesting: b and i closed in the wrong order versus the right order. No duplicate attributes: an h1 with two ids versus one id. Unique IDs: two anchors sharing the id x versus x and y.</desc>
<rect width="800" height="448" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">The four things 4.1.1 Parsing asked for</text><rect x="40" y="76" width="354" height="166" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="56" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Complete start and end tags</text><rect x="56" y="122" width="322" height="42" rx="8" fill="#fdf0ef"/><text x="68" y="149" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#b42318" text-anchor="start">&lt;p&gt;Hello</text><text x="362" y="149" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#b42318" text-anchor="end">×</text><rect x="56" y="178" width="322" height="42" rx="8" fill="#e8f1e7"/><text x="68" y="205" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#44723f" text-anchor="start">&lt;p&gt;Hello&lt;/p&gt;</text><text x="362" y="205" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="end">✓</text><rect x="406" y="76" width="354" height="166" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="422" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Elements nested correctly</text><rect x="422" y="122" width="322" height="42" rx="8" fill="#fdf0ef"/><text x="434" y="149" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#b42318" text-anchor="start">&lt;b&gt;&lt;i&gt;Hi&lt;/b&gt;&lt;/i&gt;</text><text x="728" y="149" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#b42318" text-anchor="end">×</text><rect x="422" y="178" width="322" height="42" rx="8" fill="#e8f1e7"/><text x="434" y="205" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#44723f" text-anchor="start">&lt;b&gt;&lt;i&gt;Hi&lt;/i&gt;&lt;/b&gt;</text><text x="728" y="205" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="end">✓</text><rect x="40" y="254" width="354" height="166" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="56" y="284" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">No duplicate attributes</text><rect x="56" y="300" width="322" height="42" rx="8" fill="#fdf0ef"/><text x="68" y="327" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#b42318" text-anchor="start">&lt;h1 id=&quot;a&quot; id=&quot;b&quot;&gt;</text><text x="362" y="327" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#b42318" text-anchor="end">×</text><rect x="56" y="356" width="322" height="42" rx="8" fill="#e8f1e7"/><text x="68" y="383" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#44723f" text-anchor="start">&lt;h1 id=&quot;a&quot;&gt;</text><text x="362" y="383" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#44723f" text-anchor="end">✓</text><rect x="406" y="254" width="354" height="166" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="422" y="284" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Unique IDs</text><rect x="422" y="300" width="322" height="42" rx="8" fill="#fdf0ef"/><text x="434" y="327" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#b42318" tex