<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="290" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Audio description fills the pauses with what is on screen</text><rect x="24" y="80" width="752" height="44" rx="8" fill="#eef0f3" stroke="#eef0f3" stroke-width="1.5"/><text x="36" y="107" font-size="13" font-weight="800" fill="#5b6270" text-anchor="start">Dialogue</text><rect x="130" y="88" width="100" height="28" rx="6" fill="#cfd6e0" stroke="none" stroke-width="1.5"/><text x="140" y="107" font-size="12" font-weight="600" fill="#1f2430" text-anchor="start">Maya: "Ready?"</text><rect x="420" y="88" width="140" height="28" rx="6" fill="#cfd6e0" stroke="none" stroke-width="1.5"/><text x="430" y="107" font-size="12" font-weight="600" fill="#1f2430" text-anchor="start">Sam: "Let's go."</text><rect x="24" y="140" width="752" height="44" rx="8" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><text x="36" y="167" font-size="13" font-weight="800" fill="#365c32" text-anchor="start">Description</text><rect x="240" y="148" width="170" height="28" rx="6" fill="#cfe7c9" stroke="none" stroke-width="1.5"/><text x="250" y="167" font-size="12" font-weight="700" fill="#365c32" text-anchor="start">She zips the tent shut.</text><rect x="570" y="148" width="190" height="28" rx="6" fill="#cfe7c9" stroke="none" stroke-width="1.5"/><text x="580" y="167" font-size="12" font-weight="700" fill="#365c32" text-anchor="start">They walk into the storm.</text><path d="M24 204H776" stroke="#c7ccd4" stroke-width="1.5"/><text x="24" y="222" font-size="11" font-weight="400" fill="#5b6270" text-anchor="start">0:00</text><text x="269" y="222" font-size="11" font-weight="400" fill="#5b6270" text-anchor="start">0:05</text><text x="514" y="222" font-size="11" font-weight="400" fill="#5b6270" text-anchor="start">0:10</text><text x="759" y="222" font-size="11" font-weight="400" fill="#5b6270" text-anchor="start">0:15</text><text x="400" y="260" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">Narration describes actions, scene changes and on-screen text that the dialogue does not</text>
<text x="400" y="279" font-size="14" font-weight="400" fill="#5b6270" text-anchor="middle">mention, without talking over it.</text>
