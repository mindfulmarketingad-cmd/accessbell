<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="280" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Two ways to meet 1.2.3</text><rect x="24" y="66" width="364" height="190" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="54" cy="100" r="13" fill="#44723f"/><path d="M47 100l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="106" font-size="16" font-weight="800" fill="#365c32" text-anchor="start">Audio description</text><text x="46" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">Narration of key visuals</text><text x="46" y="168" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• A described version of the video</text><text x="46" y="192" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• Or a second, selectable audio track</text><text x="46" y="216" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• Required again at Level AA (1.2.5)</text><rect x="412" y="66" width="364" height="190" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="442" cy="100" r="13" fill="#44723f"/><path d="M435 100l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="106" font-size="16" font-weight="800" fill="#365c32" text-anchor="start">Media alternative</text><text x="434" y="136" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">A full text version</text><text x="434" y="168" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• Dialogue and all key visual details</text><text x="434" y="192" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• In the order they happen</text><text x="434" y="216" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">• Also helps deafblind users</text>
</svg>
