<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
<title id="t">Which exceptions each criterion allows</title>
<desc id="d">Table comparing 3.3.8 Level AA and 3.3.9 Level AAA. Alternative method: allowed in both. Mechanism such as a password manager: allowed in both. Object recognition: allowed in 3.3.8, not in 3.3.9. Personal content: allowed in 3.3.8, not in 3.3.9.</desc>
<rect width="800" height="440" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Which exceptions each criterion allows</text><rect x="40" y="76" width="720" height="40" rx="12" fill="#f7f8f6" stroke="#cfd4ce" stroke-width="1.5"/><text x="60" y="102" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#5b6170" text-anchor="start">Exception</text><text x="540" y="102" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#22262f" text-anchor="middle">3.3.8 (AA)</text><text x="670" y="102" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#22262f" text-anchor="middle">3.3.9 (AAA)</text><rect x="40" y="128" width="720" height="56" rx="12" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="60" y="162" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#22262f" text-anchor="start">Alternative: another method with no cognitive test</text><circle cx="540" cy="156" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="540" y="162" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#44723f" text-anchor="middle">✓</text><circle cx="670" cy="156" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="670" y="162" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#44723f" text-anchor="middle">✓</text><rect x="40" y="194" width="720" height="56" rx="12" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="60" y="228" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#22262f" text-anchor="start">Mechanism: a tool helps, like a password manager</text><circle cx="540" cy="222" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="540" y="228" 