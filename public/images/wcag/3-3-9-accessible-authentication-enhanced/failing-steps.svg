<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="t d">
<title id="t">Login steps that fail 3.3.9 with no alternative</title>
<desc id="d">Four login challenges: pick the pictures with a bus, which is object recognition; find the picture you uploaded, which is personal content; copy wobbly text, which is transcription; and solve 17 plus 26, which is a calculation. Each asks people to recognize, remember or work something out.</desc>
<rect width="800" height="424" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Login steps that fail 3.3.9 with no alternative</text><rect x="40" y="76" width="354" height="138" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="56" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#b42318" text-anchor="start">Pick the pictures</text><text x="56" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">Select all squares with a bus</text><rect x="56" y="156" width="120" height="34" rx="8" fill="#fff" stroke="#cfd4ce"/><text x="116" y="179" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6170" text-anchor="middle">Continue</text><text x="190" y="179" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6170" text-anchor="start">Object recognition</text><rect x="406" y="76" width="354" height="138" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="422" y="106" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#b42318" text-anchor="start">Find your photo</text><text x="422" y="138" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">Which picture did you upload?</text><rect x="422" y="156" width="120" height="34" rx="8" fill="#fff" stroke="#cfd4ce"/><text x="482" y="179" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6170" text-anchor="middle">Continue</text><text x="556" y="179" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6170" text-anchor="start">Personal content</text><rect x="40" y="226" width="354" height="138" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="56" y="256" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#b42318" text-anchor="start">Type the letters</text><text x="56" y="288" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">Copy the wobbly text: xK7q</text><rect x="56" y="306" width="120" height="34" rx="8" fill="#fff" stroke="#cfd4ce"/><text x="116" y="329" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6170" text-anchor="middle">Continue</text><text x="190" y="329" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6170" text-anchor="start">Text transcription</text><rect x="406" y="226" width="354" height="138" rx="12" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="422" y="256" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#b42318" text-anchor="start">Solve it</text><text x="422" y="288" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#22262f" text-anchor="start">What is 17 + 26?</text><rect x="422" y="306" width="120" height="34" rx="8" fill="#fff" stroke="#cfd4ce"/><text x="482" y="329" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6170" text-anchor="middle">Continue</text><text x="556" y="329" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6170" text-anchor="start">Calculation or puzzle</text><text x="40" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Each one asks people to recognize, remember or work something out.</text>
