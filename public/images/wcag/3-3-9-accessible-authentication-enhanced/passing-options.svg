<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d">
<title id="t">Sign-in options that need no cognitive test</title>
<desc id="d">Five sign-in options that pass: a passkey or biometric, an email or SMS link, a password manager with autofill and paste, single sign-on, and a copy-friendly one-time code that can be autofilled or pasted.</desc>
<rect width="800" height="430" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Sign-in options that need no cognitive test</text><rect x="40" y="76" width="720" height="50" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><circle cx="70" cy="101" r="12" fill="#44723f"/><text x="70" y="107" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="96" y="107" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Passkey or biometric</text><text x="400" y="107" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Fingerprint, face or device PIN</text><rect x="40" y="136" width="720" height="50" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><circle cx="70" cy="161" r="12" fill="#44723f"/><text x="70" y="167" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="96" y="167" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Email or SMS link</text><text x="400" y="167" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Tap the link, no code to copy</text><rect x="40" y="196" width="720" height="50" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><circle cx="70" cy="221" r="12" fill="#44723f"/><text x="70" y="227" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="96" y="227" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Password manager</text><text x="400" y="227" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Autofill and paste both work</text><rect x="40" y="256" width="720" height="50" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><circle cx="70" cy="281" r="12" fill="#44723f"/><text x="70" y="287" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="96" y="287" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Single sign-on</text><text x="400" y="287" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Use an account you already have</text><rect x="40" y="316" width="720" height="50" rx="12" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><circle cx="70" cy="341" r="12" fill="#44723f"/><text x="70" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="96" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Copy-friendly one-time code</text><text x="400" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6170" text-anchor="start">Autofill or paste the code</text><text x="40" y="398" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">Offer at least one of these on every step of signing in.</text>
<text x="760" y="414" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
