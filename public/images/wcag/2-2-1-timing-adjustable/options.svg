<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="270" fill="#fff"/>
<text x="24" y="40" font-size="20" font-weight="800" fill="#1f2430" text-anchor="start">Every time limit needs at least one of these</text><rect x="24" y="66" width="240" height="180" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="52" cy="98" r="13" fill="#44723f"/><path d="M45 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Turn off</text><text x="44" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">People can turn the time limit</text>
<text x="44" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">off before they meet it.</text><rect x="280" y="66" width="240" height="180" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="308" cy="98" r="13" fill="#44723f"/><path d="M301 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Adjust</text><text x="300" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">People can set it to at least 10</text>
<text x="300" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">times the default length.</text><rect x="536" y="66" width="240" height="180" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="1.5"/><circle cx="564" cy="98" r="13" fill="#44723f"/><path d="M557 98l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="104" font-size="15" font-weight="800" fill="#365c32" text-anchor="start">Extend</text><text x="556" y="136" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">A warning and at least 20</text>
<text x="556" y="155" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">seconds to extend with a simple</text>
<text x="556" y="174" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">action, at least 10 times.</text>
</svg>
