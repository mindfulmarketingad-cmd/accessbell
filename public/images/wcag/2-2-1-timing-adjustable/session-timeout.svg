<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="400" fill="#fff"/>
<rect x="24" y="20" width="364" height="360" rx="16" fill="#fdf0ef" stroke="#f4c7c3" stroke-width="2"/>
<circle cx="58" cy="58" r="15" fill="#b42318"/><path d="M52 52l12 12M64 52l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="82" y="65" font-size="18" font-weight="700" fill="#b42318" text-anchor="start">Signed out without warning</text>
<rect x="412" y="20" width="364" height="360" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/>
<circle cx="446" cy="58" r="15" fill="#44723f"/><path d="M439 58l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="470" y="65" font-size="17" font-weight="700" fill="#365c32" text-anchor="start">Warned, with time to extend</text><rect x="48" y="96" width="316" height="200" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="66" y="130" font-size="16" font-weight="800" fill="#b42318" text-anchor="start">Session expired</text><text x="66" y="156" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">Please sign in again. Your answers</text>
<text x="66" y="175" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">were not saved.</text><rect x="66" y="206" width="120" height="38" rx="8" fill="#44723f" stroke="#44723f" stroke-width="1.5"/><text x="126" y="230" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Sign in</text><text x="206" y="350" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">Slow typists and screen reader users lose</text>
<text x="206" y="369" font-size="14" font-weight="700" fill="#b42318" text-anchor="middle">their work</text><rect x="436" y="96" width="316" height="200" rx="12" fill="#fff" stroke="#44723f" stroke-width="2.5"/><text x="454" y="128" font-size="16" font-weight="800" fill="#1f2430" text-anchor="start">Your session ends in 1:52</text><text x="454" y="154" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">You have been inactive for a while. Do</text>
<text x="454" y="173" font-size="13" font-weight="400" fill="#1f2430" text-anchor="start">you need more time?</text><rect x="454" y="206" width="150" height="38" rx="8" fill="#44723f" stroke="#44723f" stroke-width="1.5"/><text x="529" y="230" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Stay signed in</text><rect x="450" y="202" width="158" height="46" rx="11" fill="none" stroke="#1f5fbf" stroke-width="3"/><rect x="616" y="206" width="100" height="38" rx="8" fill="#fff" stroke="#c7ccd4" stroke-width="1.5"/><text x="666" y="230" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">Sign out</text><text x="454" y="276" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">At least 20 seconds to respond</text><text x="594" y="350" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">One simple action gives more time, and it</text>
<text x="594" y="369" font-size="14" font-weight="700" fill="#365c32" text-anchor="middle">can be repeated</text>
</svg>
