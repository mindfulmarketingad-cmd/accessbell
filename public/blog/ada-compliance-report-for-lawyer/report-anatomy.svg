<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="510" fill="#fff"/><text x="400" y="42" font-size="21" font-weight="700" fill="#1f2430" text-anchor="middle">What an ADA compliance report for your lawyer should contain</text><rect x="24" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="113.5" cy="106" r="20" fill="#44723f"/><text x="113.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="113.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Scope</text><text x="113.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Which pages, apps</text><text x="113.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">and user journeys</text><text x="113.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">were tested, and</text><text x="113.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">on what dates</text><rect x="215" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="304.5" cy="106" r="20" fill="#44723f"/><text x="304.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="304.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Standard</text><text x="304.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">The benchmark used,</text><text x="304.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">usually WCAG 2.1</text><text x="304.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">or 2.2 Level AA</text><rect x="406" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="495.5" cy="106" r="20" fill="#44723f"/><text x="495.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="495.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Method</text><text x="495.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Automated tools,</text><text x="495.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">manual checks, the</text><text x="495.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">browsers and screen</text><text x="495.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">readers used</text><rect x="597" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="686.5" cy="106" r="20" fill="#44723f"/><text x="686.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="686.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Findings</text><text x="686.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Each issue with its</text><text x="686.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">WCAG criterion,</text><text x="686.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">severity, page and</text><text x="686.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">element</text><rect x="24" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="113.5" cy="320" r="20" fill="#44723f"/><text x="113.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="113.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Fix log</text><text x="113.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">What was fixed, when,</text><text x="113.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">and the scan that</text><text x="113.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">confirmed it</text><rect x="215" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="304.5" cy="320" r="20" fill="#44723f"/><text x="304.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="304.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Open issues</text><text x="304.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">What is still open,</text><text x="304.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">and the plan and</text><text x="304.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">dates to fix it</text><rect x="406" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="495.5" cy="320" r="20" fill="#44723f"/><text x="495.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="495.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Third parties</text><text x="495.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Chat, payments,</text><text x="495.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">reviews, booking:</text><text x="495.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">who owns each one</text><rect x="597" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="686.5" cy="320" r="20" fill="#44723f"/><text x="686.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="686.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Monitoring</text><text x="686.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">How the site is</text><text x="686.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">checked going forward</text><text x="686.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">and who is responsible</text></svg>