<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 442" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="442" fill="#fff"/><text x="32" y="42" font-size="21" font-weight="700" fill="#1f2430">What five ADA cases cost, in disclosed dollars</text><text x="32" y="68" font-size="14" fill="#5b6270">Damages, settlement funds, fees and penalties that were made public</text><text x="32" y="120" font-size="15" font-weight="600" fill="#1f2430">Target (2008)</text><text x="32" y="139" font-size="12" fill="#5b6270">$6M class fund + $3.74M fees</text><rect x="250" y="104" width="400.0" height="26" rx="6" fill="#44723f"/><text x="660" y="123" font-size="15" font-weight="700" fill="#1f2430">$9.74M</text><text x="32" y="178" font-size="15" font-weight="600" fill="#1f2430">Fashion Nova (proposed)</text><text x="32" y="197" font-size="12" fill="#5b6270">Not approved; DOJ objected</text><rect x="250" y="162" width="211.5" height="26" rx="6" fill="#8a5a00" fill-opacity="0.35" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/><text x="471.4989733059548" y="181" font-size="15" font-weight="700" fill="#1f2430">$5.15M</text><text x="32" y="236" font-size="15" font-weight="600" fill="#1f2430">Netflix (2012)</text><text x="32" y="255" font-size="12" fill="#5b6270">$755K fees + $40K monitoring</text><rect x="250" y="220" width="32.6" height="26" rx="6" fill="#44723f"/><text x="292.6488706365503" y="239" font-size="15" font-weight="700" fill="#1f2430">$795K</text><text x="32" y="294" font-size="15" font-weight="600" fill="#1f2430">H&amp;R Block (2014)</text><text x="32" y="313" font-size="12" fill="#5b6270">$45K damages + $55K penalty</text><rect x="250" y="278" width="4.1" height="26" rx="6" fill="#44723f"/><text x="264.10677618069815" y="297" font-size="15" font-weight="700" fill="#1f2430">$100K</text><text x="32" y="352" font-size="15" font-weight="600" fill="#1f2430">Domino’s (2022)</text><text x="32" y="371" font-size="12" fill="#5b6270">Settled after 6 years</text><rect x="250" y="336" width="4.0" height="26" rx="6" fill="#5b6270"/><text x="264" y="355" font-size="15" font-weight="700" fill="#1f2430">Not disclosed</text><text x="32" y="420" font-size="12" fill="#5b6270">Sources linked in this article. Amounts do not include each company’s own legal or remediation costs.</text></svg>