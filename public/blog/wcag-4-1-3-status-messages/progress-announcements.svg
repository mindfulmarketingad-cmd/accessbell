<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="t d">
<title id="t">Progress: show every step, announce the milestones</title>
<desc id="d">An upload of report.pdf is at 60 percent, coded as a progressbar with aria-valuenow 60. Below, four milestone announcements a screen reader might make through a status region: Uploading 25 percent, 50 percent, 75 percent and Upload complete.</desc>
<rect width="800" height="410" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">Progress: show every step, announce the milestones</text><rect x="40" y="76" width="720" height="118" rx="12" fill="#f7f8f6" stroke="#cfd4ce"/><text x="60" y="108" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#22262f" text-anchor="start">Uploading report.pdf</text><rect x="60" y="124" width="680" height="20" rx="10" fill="#e8ebe7"/><rect x="60" y="124" width="408" height="20" rx="10" fill="#44723f"/><text x="740" y="108" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#22262f" text-anchor="end">60%</text><text x="60" y="178" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6170" text-anchor="start">&lt;div role=&quot;progressbar&quot; aria-valuenow=&quot;60&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;</text><text x="40" y="236" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#22262f" text-anchor="start">What the screen reader says</text><rect x="40" y="254" width="168" height="76" rx="10" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="124" y="282" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="middle">25%</text><text x="124" y="310" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#22262f" text-anchor="middle">Uploading, 25 percent</text><rect x="222" y="254" width="168" height="76" rx="10" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="306" y="282" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="middle">50%</text><text x="306" y="310" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#22262f" text-anchor="middle">Uploading, 50 percent</text><rect x="404" y="254" width="168" height="76" rx="10" fill="#fff" stroke="#cfd4ce" stroke-width="1.5"/><text x="488" y="282" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="middle">75%</text><text x="488" y="310" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#22262f" text-anchor="middle">Uploading, 75 percent</text><rect x="586" y="254" width="168" height="76" rx="10" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="670" y="282" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#44723f" text-anchor="middle">Done</text><text x="670" y="310" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#22262f" text-anchor="middle">Upload complete</text><text x="40" y="364" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6170" text-anchor="start">A busy progress bar can talk over everything else, so announce milestones through a role=&quot;status&quot; region.</text><text x="760" y="396" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
