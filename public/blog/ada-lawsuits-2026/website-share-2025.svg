<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 248" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="248" fill="#fff"/><text x="32" y="42" font-size="21" font-weight="700" fill="#1f2430">How many 2025 federal ADA lawsuits were about websites?</text><text x="32" y="100" font-size="15" font-weight="600" fill="#1f2430">All Title III lawsuits</text><rect x="230" y="84" width="420.0" height="26" rx="6" fill="#44723f"/><text x="660" y="103" font-size="15" font-weight="700" fill="#1f2430">8,667</text><text x="32" y="158" font-size="15" font-weight="600" fill="#1f2430">Website lawsuits</text><text x="32" y="177" font-size="12" fill="#5b6270">36% of the total, up 27% on 2024</text><rect x="230" y="142" width="151.0" height="26" rx="6" fill="#44723f"/><text x="391.04880581516096" y="161" font-size="15" font-weight="700" fill="#1f2430">3,117</text><text x="32" y="226" font-size="12" fill="#5b6270">Source: Seyfarth Shaw, ADA Title III blog, federal court filings in 2025.</text></svg>