<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="296" fill="#fff"/><text x="400" y="42" font-size="21" font-weight="700" fill="#1f2430" text-anchor="middle">Four 2026 developments and what they teach</text><rect x="24" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="113.5" cy="106" r="20" fill="#44723f"/><text x="113.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="113.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Fix the site</text><text x="113.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Jones v. Moscot (SDNY):</text><text x="113.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">dismissed as moot</text><text x="113.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">after proof the site</text><text x="113.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">was accessible</text><rect x="215" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="304.5" cy="106" r="20" fill="#44723f"/><text x="304.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="304.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Check standing</text><text x="304.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Fernandez v. Cuddle</text><text x="304.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">Clones (SDNY): judge</text><text x="304.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">ordered discovery into</text><text x="304.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">a serial plaintiff</text><rect x="406" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="495.5" cy="106" r="20" fill="#44723f"/><text x="495.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="495.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Demand real fixes</text><text x="495.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Fashion Nova: DOJ</text><text x="495.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">opposed a $5.15M deal</text><text x="495.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">with no concrete</text><text x="495.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">remediation plan</text><rect x="597" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="686.5" cy="106" r="20" fill="#44723f"/><text x="686.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="686.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Know state law</text><text x="686.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Missouri SB 907:</text><text x="686.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">defendants can sue</text><text x="686.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">over abusive website</text><text x="686.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">suits (from Aug 2026)</text></svg>