<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="510" fill="#fff"/><text x="400" y="42" font-size="21" font-weight="700" fill="#1f2430" text-anchor="middle">The order to fix your website after an ADA complaint</text><rect x="24" y="70" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="145.33333333333331" cy="106" r="20" fill="#44723f"/><text x="145.33333333333331" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="145.33333333333331" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Named barriers</text><text x="145.33333333333331" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Fix every barrier</text><text x="145.33333333333331" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">listed in the complaint</text><text x="145.33333333333331" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">or demand letter first</text><rect x="278.66666666666663" y="70" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="399.99999999999994" cy="106" r="20" fill="#44723f"/><text x="399.99999999999994" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="399.99999999999994" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Blocked tasks</text><text x="399.99999999999994" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Checkout, sign-up,</text><text x="399.99999999999994" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">contact and booking</text><text x="399.99999999999994" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">forms, main navigation</text><rect x="533.3333333333333" y="70" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="654.6666666666666" cy="106" r="20" fill="#44723f"/><text x="654.6666666666666" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="654.6666666666666" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Shared templates</text><text x="654.6666666666666" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Header, footer, product</text><text x="654.6666666666666" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">and article templates:</text><text x="654.6666666666666" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">one fix, every page</text><rect x="24" y="284" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="145.33333333333331" cy="320" r="20" fill="#44723f"/><text x="145.33333333333331" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="145.33333333333331" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Site-wide scan</text><text x="145.33333333333331" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Clear the remaining</text><text x="145.33333333333331" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">automated issues,</text><text x="145.33333333333331" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">critical and serious first</text><rect x="278.66666666666663" y="284" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="399.99999999999994" cy="320" r="20" fill="#44723f"/><text x="399.99999999999994" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="399.99999999999994" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Manual testing</text><text x="399.99999999999994" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Keyboard only, then a</text><text x="399.99999999999994" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">screen reader, on your</text><text x="399.99999999999994" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">key user journeys</text><rect x="533.3333333333333" y="284" width="242.66666666666666" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="654.6666666666666" cy="320" r="20" fill="#44723f"/><text x="654.6666666666666" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="654.6666666666666" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Document, monitor</text><text x="654.6666666666666" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Dated fix log, a</text><text x="654.6666666666666" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">statement and daily</text><text x="654.6666666666666" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">scans so it stays fixed</text></svg>