<rect x="24" y="40" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="60" cy="80" r="18" fill="#44723f"/><text x="60" y="87" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="88" y="87" font-size="18" font-weight="700" fill="#1f2430">Crawl and index</text><text x="44" y="136" font-size="15" fill="#5b6270">Can search engines</text><text x="44" y="160" font-size="15" fill="#5b6270">find every page?</text><path d="M266 120h10" stroke="#8b93a1" stroke-width="2.5"/><path d="M272 114l6 6-6 6" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="40" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="318" cy="80" r="18" fill="#44723f"/><text x="318" y="87" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="346" y="87" font-size="18" font-weight="700" fill="#1f2430">Technical health</text><text x="302" y="136" font-size="15" fill="#5b6270">Status codes, redirects,</text><text x="302" y="160" font-size="15" fill="#5b6270">canonicals, sitemap</text><path d="M524 120h10" stroke="#8b93a1" stroke-width="2.5"/><path d="M530 114l6 6-6 6" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="40" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="576" cy="80" r="18" fill="#44723f"/><text x="576" y="87" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="604" y="87" font-size="18" font-weight="700" fill="#1f2430">Performance</text><text x="560" y="136" font-size="15" fill="#5b6270">Speed, mobile layout,</text><text x="560" y="160" font-size="15" fill="#5b6270">Core Web Vitals</text><rect x="24" y="230" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="60" cy="270" r="18" fill="#44723f"/><text x="60" y="277" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="88" y="277" font-size="18" font-weight="700" fill="#1f2430">On-page basics</text><text x="44" y="326" font-size="15" fill="#5b6270">Titles, descriptions,</text><text x="44" y="350" font-size="15" fill="#5b6270">headings, alt text</text><path d="M266 310h10" stroke="#8b93a1" stroke-width="2.5"/><path d="M272 304l6 6-6 6" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="282" y="230" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="318" cy="270" r="18" fill="#44723f"/><text x="318" y="277" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="346" y="277" font-size="18" font-weight="700" fill="#1f2430">Content quality</text><text x="302" y="326" font-size="15" fill="#5b6270">Helpful, current,</text><text x="302" y="350" font-size="15" fill="#5b6270">no duplicates</text><path d="M524 310h10" stroke="#8b93a1" stroke-width="2.5"/><path d="M530 304l6 6-6 6" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="230" width="236" height="160" rx="16" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="576" cy="270" r="18" fill="#44723f"/><text x="576" y="277" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="604" y="277" font-size="18" font-weight="700" fill="#1f2430">Links</text><text x="560" y="326" font-size="15" fill="#5b6270">Internal links, orphans,</text><text x="560" y="350" font-size="15" fill="#5b6270">broken links</text><path d="M760 200v10H40v10" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M34 216l6 6 6-6" fill="none" stroke="#8b93a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
