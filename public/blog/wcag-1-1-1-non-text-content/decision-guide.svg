<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="800" height="470" fill="#fff"/>
<text x="40" y="48" font-size="20" font-weight="700" fill="#1f2430" text-anchor="start">Which text alternative does this image need?</text>
