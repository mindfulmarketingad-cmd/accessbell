<path d="M332 114h40" stroke="#44723f" stroke-width="2.5"/><path d="M366 108l8 6-8 6" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="106" font-size="12" font-weight="700" fill="#365c32" text-anchor="middle">Yes</text>
<rect x="384" y="78" width="392" height="72" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><text x="402" y="106" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Describe the action or destination</text>
<rect x="402" y="116" width="116" height="24" rx="5" fill="#2b2f3a"/><text x="412" y="133" font-size="12.5" font-weight="400" fill="#e8eaee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alt="Search"</text>
<path d="M174 152v20" stroke="#8b93a1" stroke-width="2"/><path d="M168 166l6 6 6-6" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="168" font-size="12" font-weight="700" fill="#5b6270" text-anchor="start">No</text>
<rect x="24" y="174" width="300" height="72" rx="12" fill="#f5f6f8" stroke="#d9dde3" stroke-width="2"/><text x="44" y="216" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Does it show text?</text>
<path d="M332 210h40" stroke="#44723f" stroke-width="2.5"/><path d="M366 204l8 6-8 6" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="202" font-size="12" font-weight="700" fill="#365c32" text-anchor="middle">Yes</text>
<rect x="384" y="174" width="392" height="72" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><text x="402" y="202" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Use the same words as the image</text>
<rect x="402" y="212" width="276" height="24" rx="5" fill="#2b2f3a"/><text x="412" y="229" font-size="12.5" font-weight="400" fill="#e8eaee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alt="Spring sale: 20% off tents"</text>
<path d="M174 248v20" stroke="#8b93a1" stroke-width="2"/><path d="M168 262l6 6 6-6" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="264" font-size="12" font-weight="700" fill="#5b6270" text-anchor="start">No</text>
<rect x="24" y="270" width="300" height="72" rx="12" fill="#f5f6f8" stroke="#d9dde3" stroke-width="2"/><text x="44" y="312" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Does it add information?</text>
<path d="M332 306h40" stroke="#44723f" stroke-width="2.5"/><path d="M366 300l8 6-8 6" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="298" font-size="12" font-weight="700" fill="#365c32" text-anchor="middle">Yes</text>
<rect x="384" y="270" width="392" height="72" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><text x="402" y="298" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Describe the information it adds</text>
<rect x="402" y="308" width="260" height="24" rx="5" fill="#2b2f3a"/><text x="412" y="325" font-size="12.5" font-weight="400" fill="#e8eaee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alt="Bookings rose each month"</text>
<path d="M174 344v20" stroke="#8b93a1" stroke-width="2"/><path d="M168 358l6 6 6-6" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="360" font-size="12" font-weight="700" fill="#5b6270" text-anchor="start">No</text>
<rect x="24" y="366" width="300" height="72" rx="12" fill="#f5f6f8" stroke="#d9dde3" stroke-width="2"/><text x="44" y="408" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">Only there for decoration?</text>
<path d="M332 402h40" stroke="#44723f" stroke-width="2.5"/><path d="M366 396l8 6-8 6" fill="none" stroke="#44723f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="394" font-size="12" font-weight="700" fill="#365c32" text-anchor="middle">Yes</text>
<rect x="384" y="366" width="392" height="72" rx="12" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><text x="402" y="394" font-size="14" font-weight="700" fill="#365c32" text-anchor="start">Hide it from screen readers</text>
<rect x="402" y="404" width="68" height="24" rx="5" fill="#2b2f3a"/><text x="412" y="421" font-size="12.5" font-weight="400" fill="#e8eaee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alt=""</text>
