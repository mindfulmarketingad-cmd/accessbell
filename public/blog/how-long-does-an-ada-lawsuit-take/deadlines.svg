<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="320" fill="#fff"/><text x="400" y="42" font-size="21" font-weight="700" fill="#1f2430" text-anchor="middle">The fixed deadlines in a federal ADA lawsuit</text><rect x="24" y="70" width="140.8" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="94.4" cy="106" r="20" fill="#44723f"/><text x="94.4" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="94.4" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Service</text><text x="94.4" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Plaintiff has 90 days</text><text x="94.4" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">after filing to serve</text><text x="94.4" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">you (FRCP 4(m))</text><rect x="176.8" y="70" width="140.8" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="247.20000000000002" cy="106" r="20" fill="#44723f"/><text x="247.20000000000002" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="247.20000000000002" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Answer</text><text x="247.20000000000002" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">21 days after service</text><text x="247.20000000000002" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">(FRCP 12), or 60 days</text><text x="247.20000000000002" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">if you waive service</text><rect x="329.6" y="70" width="140.8" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="400" cy="106" r="20" fill="#44723f"/><text x="400" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="400" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Plan</text><text x="400" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Parties confer on</text><text x="400" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">discovery and a</text><text x="400" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">schedule (FRCP 26(f))</text><rect x="482.40000000000003" y="70" width="140.8" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="552.8000000000001" cy="106" r="20" fill="#44723f"/><text x="552.8000000000001" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="552.8000000000001" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Judgment</text><text x="552.8000000000001" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Settlement, dismissal,</text><text x="552.8000000000001" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">summary judgment</text><text x="552.8000000000001" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">or trial</text><rect x="635.2" y="70" width="140.8" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="705.6" cy="106" r="20" fill="#44723f"/><text x="705.6" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="705.6" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Appeal</text><text x="705.6" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">30 days after</text><text x="705.6" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">judgment to file a</text><text x="705.6" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">notice (FRAP 4)</text><text x="24" y="308" font-size="12" fill="#5b6270">Federal Rules of Civil Procedure and Federal Rules of Appellate Procedure. State courts have their own deadlines.</text></svg>