<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 442" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="442" fill="#fff"/><text x="32" y="42" font-size="21" font-weight="700" fill="#1f2430">How long real ADA cases took</text><text x="32" y="68" font-size="14" fill="#5b6270">From filing to the end of the case (settlement, decree or dismissal)</text><text x="32" y="120" font-size="15" font-weight="600" fill="#1f2430">Jones v. Moscot</text><text x="32" y="139" font-size="12" fill="#5b6270">Filed 2025, dismissed as moot March 2026</text><rect x="250" y="104" width="73.8" height="26" rx="6" fill="#44723f"/><text x="333.8461538461538" y="123" font-size="15" font-weight="700" fill="#1f2430">15 months or less</text><text x="32" y="178" font-size="15" font-weight="600" fill="#1f2430">NAD v. Netflix</text><text x="32" y="197" font-size="12" fill="#5b6270">Filed June 2011, decree Oct. 2012</text><rect x="250" y="162" width="81.8" height="26" rx="6" fill="#44723f"/><text x="341.8461538461538" y="181" font-size="15" font-weight="700" fill="#1f2430">16 months</text><text x="32" y="236" font-size="15" font-weight="600" fill="#1f2430">NFB v. Target</text><text x="32" y="255" font-size="12" fill="#5b6270">Filed Feb. 2006, settled Aug. 2008</text><rect x="250" y="220" width="153.8" height="26" rx="6" fill="#44723f"/><text x="413.84615384615387" y="239" font-size="15" font-weight="700" fill="#1f2430">2.5 years</text><text x="32" y="294" font-size="15" font-weight="600" fill="#1f2430">Robles v. Domino’s</text><text x="32" y="313" font-size="12" fill="#5b6270">Filed Sept. 2016, settled June 2022</text><rect x="250" y="278" width="353.8" height="26" rx="6" fill="#44723f"/><text x="613.8461538461538" y="297" font-size="15" font-weight="700" fill="#1f2430">nearly 6 years</text><text x="32" y="352" font-size="15" font-weight="600" fill="#1f2430">Alcazar v. Fashion Nova</text><text x="32" y="371" font-size="12" fill="#5b6270">Filed 2020, settlement still pending</text><rect x="250" y="336" width="387.7" height="26" rx="6" fill="#8a5a00" fill-opacity="0.35" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/><text x="647.6923076923076" y="355" font-size="15" font-weight="700" fill="#1f2430">6+ years, open</text><text x="32" y="420" font-size="12" fill="#5b6270">Sources: court records and coverage linked in this article.</text></svg>