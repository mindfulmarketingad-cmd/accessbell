<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" role="img" aria-labelledby="t d">
<title id="t">How to avoid being sued: a loop, not a one-time fix</title>
<desc id="d">A four-step loop that repeats on a schedule: 1, scan every page in a real browser on desktop and mobile. 2, fix failing code ranked by impact, with instructions. 3, monitor with rescans that catch new barriers after every change. 4, document with dated scans, fixes and a public statement. Barriers named in many complaints, like missing alt text and unlabeled forms, are ones automated scans find. Pair scans with keyboard and screen reader checks of checkout.</desc>
<rect width="800" height="408" rx="16" fill="#fff"/>
