<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" width="800" height="516" role="img" aria-labelledby="t d">
<title id="t">What happened after one small online store was sued</title>
<desc id="d">Seven steps: 1, served with a class action complaint saying the site shuts out blind shoppers. 2, the same plaintiff also sued local competitors. 3, several businesses share one lawyer for a flat fee. 4, the first offer is declined and the plaintiff pushes for discovery of finances and website records. 5, one or two video mediation sessions over weeks or months. 6, settled for $5,000. 7, the website still has to be made accessible at extra cost.</desc>
<rect width="800" height="516" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">What happened after one small online store was sued</text><line x1="72" y1="92" x2="72" y2="428" stroke="#cfd4ce" stroke-width="3"/><circle cx="72" cy="92" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="2"/><text x="72" y="97" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#44723f" text-anchor="middle">1</text><text x="104" y="90" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Served</text><text x="104" y="111" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">A class action complaint says the site shuts out blind shoppers</text><circle cx="72" cy="148" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="2"/><text x="72" y="153" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#44723f" text-anchor="middle">2</text><text x="104" y="146" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Pattern spotted</text><text x="104" y="167" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">The same plaintiff sued their local competitors too</text><circle cx="72" cy="204" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="2"/><text x="72" y="209" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#44723f" text-anchor="middle">3</text><text x="104" y="202" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Lawyer hired</text><text x="104" y="223" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">Several businesses share one lawyer for a flat fee</text><circle cx="72" cy="260" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="2"/><text x="72" y="265" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#44723f" text-anchor="middle">4</text><text x="104" y="258" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">First offer declined</text><text x="104" y="279" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">The plaintiff pushes for discovery: finances, site records</text><circle cx="72" cy="316" r="15" fill="#e8f1e7" stroke="#44723f" stroke-width="2"/><text x="72" y="321" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#44723f" text-anchor="middle">5</text><text x="104" y="314" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Mediation</text><text x="104" y="335" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">One or two video sessions over several weeks or months</text><circle cx="72" cy="372" r="15" fill="#fdf0ef" stroke="#b42318" stroke-width="2"/><text x="72" y="377" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#b42318" text-anchor="middle">6</text><text x="104" y="370" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Settled</text><text x="104" y="391" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">$5,000 paid to end the case</text><circle cx="72" cy="428" r="15" fill="#fdf0ef" stroke="#b42318" stroke-width="2"/><text x="72" y="433" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#b42318" text-anchor="middle">7</text><text x="104" y="426" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#22262f" text-anchor="start">Then the fix</text><text x="104" y="447" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5b6170" text-anchor="start">The website still has to be made accessible, at extra cost</text><text x="40" y="486" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6170" text-anchor="start">Based on a small business owner's public account of their 2022 case.</text>
