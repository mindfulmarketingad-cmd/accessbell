<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" aria-labelledby="t d">
<title id="t">One small lawsuit vs. a year of monitoring</title>
<desc id="d">Bar chart. Settlement paid: $5,000. Lawyer flat fee shared with other businesses: about $2,000. Fixing the site afterward: varies, extra. AccessBell Pro for 12 months: $348. The settlement and legal fee alone equal about 20 years of AccessBell Pro for one domain.</desc>
<rect width="800" height="446" rx="16" fill="#fff"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#22262f" text-anchor="start">One small lawsuit vs. a year of monitoring</text><text x="40" y="112" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#22262f" text-anchor="start">Settlement paid</text><rect x="270" y="92" width="335.7142857142857" height="30" rx="6" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="615.7142857142858" y="113" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#b42318" text-anchor="start">$5,000</text><text x="40" y="182" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#22262f" text-anchor="start">Lawyer (flat fee, shared)</text><rect x="270" y="162" width="134.28571428571428" height="30" rx="6" fill="#fdf0ef" stroke="#b42318" stroke-width="1.5"/><text x="414.2857142857143" y="183" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#b42318" text-anchor="start">about $2,000</text><text x="40" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#22262f" text-anchor="start">Fixing the site afterward</text><rect x="270" y="232" width="470" height="30" rx="6" fill="#fdf6e7" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="6 5"/><text x="284" y="253" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#8a5a00" text-anchor="start">varies, extra</text><text x="40" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#22262f" text-anchor="start">AccessBell Pro for 12 months</text><rect x="270" y="302" width="23.365714285714283" height="30" rx="6" fill="#e8f1e7" stroke="#44723f" stroke-width="1.5"/><text x="303.36571428571426" y="323" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#44723f" text-anchor="start">$348</text><line x1="40" y1="350" x2="760" y2="350" stroke="#cfd4ce"/><text x="40" y="382" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#22262f" text-anchor="start">The settlement and legal fee alone equal about 20 years of AccessBell Pro for one domain.</text><text x="40" y="408" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6170" text-anchor="start">Case costs from one owner's account. Pro is $29 per domain per month. No tool can guarantee you won't be sued.</text>
<text x="760" y="430" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#44723f" text-anchor="end">AccessBell</text>
</svg>
