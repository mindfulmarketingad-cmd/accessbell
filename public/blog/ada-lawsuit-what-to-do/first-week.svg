<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect width="800" height="510" fill="#fff"/><text x="400" y="42" font-size="21" font-weight="700" fill="#1f2430" text-anchor="middle">Your first week after an ADA lawsuit</text><rect x="24" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="113.5" cy="106" r="20" fill="#44723f"/><text x="113.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="113.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Note the date</text><text x="113.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Write down when you</text><text x="113.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">were served. The 21-day</text><text x="113.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">answer clock starts</text><text x="113.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">then (FRCP 12)</text><rect x="215" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="304.5" cy="106" r="20" fill="#44723f"/><text x="304.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="304.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Call a lawyer</text><text x="304.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">An attorney who</text><text x="304.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">defends ADA cases.</text><text x="304.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">Do not contact the</text><text x="304.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">plaintiff yourself</text><rect x="406" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="495.5" cy="106" r="20" fill="#44723f"/><text x="495.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="495.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Tell your insurer</text><text x="495.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Ask whether your</text><text x="495.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">policy covers the</text><text x="495.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">claim before you</text><text x="495.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">agree to anything</text><rect x="597" y="70" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="686.5" cy="106" r="20" fill="#44723f"/><text x="686.5" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="686.5" y="152" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Preserve records</text><text x="686.5" y="178" font-size="12.5" fill="#5b6270" text-anchor="middle">Keep the site as it</text><text x="686.5" y="197" font-size="12.5" fill="#5b6270" text-anchor="middle">was, plus logs and</text><text x="686.5" y="216" font-size="12.5" fill="#5b6270" text-anchor="middle">any accessibility</text><text x="686.5" y="235" font-size="12.5" fill="#5b6270" text-anchor="middle">work you have done</text><rect x="24" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="113.5" cy="320" r="20" fill="#44723f"/><text x="113.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="113.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Scan your site</text><text x="113.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Run an ADA scan on</text><text x="113.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">the pages named in</text><text x="113.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">the complaint and</text><text x="113.5" y="449" font-size="12.5" fill="#5b6270" text-anchor="middle">your key templates</text><rect x="215" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="304.5" cy="320" r="20" fill="#44723f"/><text x="304.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="304.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Check the plaintiff</text><text x="304.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Look up their other</text><text x="304.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">suits on PACER or</text><text x="304.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">CourtListener. Share</text><text x="304.5" y="449" font-size="12.5" fill="#5b6270" text-anchor="middle">it with your lawyer</text><rect x="406" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="495.5" cy="320" r="20" fill="#44723f"/><text x="495.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="495.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Start fixing</text><text x="495.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">Fix what blocks</text><text x="495.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">people first, and</text><text x="495.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">keep a dated record</text><text x="495.5" y="449" font-size="12.5" fill="#5b6270" text-anchor="middle">of every change</text><rect x="597" y="284" width="179" height="196" rx="14" fill="#f4f8f3" stroke="#cfe1ce" stroke-width="2"/><circle cx="686.5" cy="320" r="20" fill="#44723f"/><text x="686.5" y="327" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="686.5" y="366" font-size="15" font-weight="700" fill="#1f2430" text-anchor="middle">Decide strategy</text><text x="686.5" y="392" font-size="12.5" fill="#5b6270" text-anchor="middle">With your lawyer:</text><text x="686.5" y="411" font-size="12.5" fill="#5b6270" text-anchor="middle">settle early, move to</text><text x="686.5" y="430" font-size="12.5" fill="#5b6270" text-anchor="middle">dismiss, or fix and</text><text x="686.5" y="449" font-size="12.5" fill="#5b6270" text-anchor="middle">argue the case is moot</text></svg>